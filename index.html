<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyLens Weather</title>
  <meta name="description" content="SkyLens — a global weather forecasting dashboard with weather-reactive visuals." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="material-symbols-outlined">partly_cloudy_day</span></div>
      <span>SkyLens</span>
    </div>
    <nav id="main-nav">
      <button class="nav-item active" data-screen="dashboard"><span class="material-symbols-outlined">dashboard</span><small>Dash</small></button>
      <button class="nav-item" data-screen="radar"><span class="material-symbols-outlined">radar</span><small>Radar</small></button>
      <button class="nav-item" data-screen="charts"><span class="material-symbols-outlined">analytics</span><small>Charts</small></button>
      <button class="nav-item alert-nav" data-screen="alerts"><span class="material-symbols-outlined">warning</span><small>Alerts</small><i></i></button>
      <button class="nav-item" data-screen="saved"><span class="material-symbols-outlined">bookmark</span><small>Saved</small></button>
    </nav>
    <button class="nav-item settings-nav" data-screen="settings"><span class="material-symbols-outlined">settings</span><small>Config</small></button>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input id="city-search" placeholder="Search any city, town, country or coordinates..." autocomplete="off" />
        <kbd>⌘K</kbd>
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="top-location"><span class="material-symbols-outlined">location_on</span><span id="top-city">Tokyo, JP</span><button id="auto-location">Auto</button></div>
      <div class="telemetry"><span class="live-dot"></span><span>LIVE WEATHER</span><strong id="utc-time">--:--:-- UTC</strong></div>
      <div class="units"><button class="unit active" data-unit="C">°C</button><button class="unit" data-unit="F">°F</button></div>
    </header>

    <main id="app"></main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
